<div class="backdrop fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-6"
    (click)="onBackdropClick($event)">

    <div
        class="relative w-full max-w-2xl flex flex-col md:flex-row bg-card rounded-xl shadow-2xl animate-in zoom-in-95 duration-200 overflow-hidden min-h-[400px]">

        <!-- Video Preview Section -->
        <div
            class="w-full md:w-1/2 bg-black flex items-center justify-center relative border-r border-border min-h-[300px]">
            @if (!previewUrl()) {
            <div class="flex flex-col items-center gap-4 p-8 text-center">
                <div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M7 3v18M17 3v18M3 7h4M17 7h4M3 12h18M3 17h4M17 17h4" />
                    </svg>
                </div>
                <p class="text-sm text-white/70">{{ lang.t('createReel.selectVideoHint') }}</p>
                <button type="button" (click)="triggerFileInput()"
                    class="cursor-pointer px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium text-sm hover:opacity-90 transition-opacity">
                    {{ lang.t('createReel.selectVideo') }}
                </button>
            </div>
            } @else {
            <video #videoPlayer [src]="previewUrl()" class="w-full h-full max-h-[70vh] object-contain" loop
                controls></video>
            <!-- Remove Video Button -->
            <button type="button" (click)="removeFile()"
                class="cursor-pointer absolute top-4 right-4 p-2 bg-black/60 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-colors z-10 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
            }
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="video/mp4,video/x-m4v,video/*"
                class="hidden">
        </div>

        <!-- Form Section -->
        <div class="w-full md:w-1/2 flex flex-col">
            <!-- Header -->
            <div class="flex items-center justify-between p-4 border-b border-border">
                <h2 class="text-lg font-semibold text-foreground">{{ lang.t('createReel.title') }}</h2>
                <button type="button" (click)="closeModal()" [disabled]="isSubmitting()"
                    class="p-2 text-muted-foreground hover:text-foreground hover:bg-accent rounded-full transition-colors focus:outline-none disabled:opacity-50 md:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="p-4 flex-1 flex flex-col gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full ring-2 ring-primary/10 overflow-hidden flex-shrink-0">
                        @if (profilePicture() && profilePicture() !== 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop&crop=face') {
                        <img [src]="profilePicture()" alt="Profile" class="w-full h-full object-cover" />
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="w-full h-full p-2 text-muted-foreground" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        }
                    </div>
                    <span class="text-sm font-semibold text-foreground">{{ userName() }}</span>
                </div>
                <textarea [(ngModel)]="caption" [placeholder]="lang.t('createReel.captionPlaceholder')"
                    class="w-full flex-1 min-h-[150px] bg-transparent border border-border rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-primary/50 text-foreground text-sm"></textarea>
            </div>

            <!-- Footer / Actions -->
            <div class="p-4 border-t border-border flex items-center justify-end gap-3">
                <button type="button" (click)="closeModal()" [disabled]="isSubmitting()"
                    class="cursor-pointer px-4 py-2 hover:bg-accent rounded-lg font-medium text-foreground transition-colors hidden md:block">
                    {{ lang.t('feed.cancel') }}
                </button>
                <button type="button" (click)="submit()" [disabled]="!selectedFile() || isSubmitting()"
                    class="cursor-pointer px-6 py-2 bg-gradient-primary text-white rounded-lg shadow-glow font-medium hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    @if (isSubmitting()) {
                    <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                    }
                    {{ lang.t('feed.share') }}
                </button>
            </div>
        </div>

    </div>
</div>
