<!-- Card -->
<div class="rounded-xl bg-card text-card-foreground shadow-soft transition-all duration-300 hover-lift">
    <!-- CardContent -->
    <div class="p-4">
        <div class="flex items-center gap-3">
            <!-- Avatar -->
            <div (click)="navigateToProfile()"
                class="cursor-pointer w-12 h-12 rounded-full ring-2 ring-primary/20 overflow-hidden flex-shrink-0">
                @if (profilePicture()) {
                <img [src]="profilePicture()" alt="Profile" class="w-full h-full object-cover" />
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full p-2.5 text-muted-foreground"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                }
            </div>
            <button type="button" (click)="showPostModal.set(true)"
                class="flex-1 h-11 px-5 bg-secondary hover:bg-secondary/80 rounded-full
                   text-muted-foreground transition-colors text-sm cursor-pointer flex items-center justify-between group">
                <span class="text-left rtl:text-right font-medium">{{ lang.t('feed.createPost') }}</span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5 text-green-500 group-hover:scale-110 transition-transform duration-300"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                    <circle cx="9" cy="9" r="2" />
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                </svg>
            </button>
        </div>
    </div>
</div>

@if (showPostModal()) {
<div class="fixed inset-0 z-[60]">
    <app-create-post-modal (close)="showPostModal.set(false)" />
</div>
}
