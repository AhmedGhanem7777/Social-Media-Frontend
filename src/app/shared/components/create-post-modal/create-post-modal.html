<div class="backdrop fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-6"
    (click)="onBackdropClick($event)">

    <div
        class="relative w-full max-w-lg flex flex-col bg-card rounded-xl shadow-2xl animate-in zoom-in-95 duration-200">

        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-border">
            <h2 class="text-lg font-semibold text-foreground">{{ lang.t('feed.createPost') }}</h2>
            <button type="button" (click)="closeModal()" [disabled]="isSubmitting()"
                class="cursor-pointer p-2 text-muted-foreground hover:text-foreground hover:bg-accent rounded-full transition-colors focus:outline-none disabled:opacity-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>

        <!-- Body -->
        <div class="p-4 flex flex-col gap-4">

            <textarea [(ngModel)]="content" [placeholder]="lang.t('feed.createPost')"
                class="w-full min-h-[120px] bg-transparent border-none resize-none focus:outline-none text-foreground placeholder:text-muted-foreground placeholder:text-lg text-lg"></textarea>

            <!-- Image Preview -->
            @if (previewUrl()) {
            <div
                class="relative w-full rounded-lg overflow-hidden border border-border bg-black/50 group max-h-[300px]">
                <img [src]="previewUrl()" class="w-full h-full object-contain max-h-[300px]" alt="Preview">
                <button type="button" (click)="removeFile()"
                    class="cursor-pointer absolute top-2 right-2 p-1.5 bg-black/60 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-colors opacity-0 group-hover:opacity-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
            }

            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">
        </div>

        <!-- Footer / Actions -->
        <div class="p-4 border-t border-border flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button type="button" (click)="triggerFileInput()"
                    class="p-2 text-primary hover:bg-primary/10 rounded-full transition-colors cursor-pointer"
                    [title]="lang.t('createPost.addImage')">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                        <circle cx="9" cy="9" r="2" />
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                    </svg>
                </button>
            </div>

            <button type="button" (click)="submit()"
                [disabled]="(!content().trim() && !selectedFile()) || isSubmitting()"
                class="cursor-pointer px-6 py-2 bg-primary text-primary-foreground rounded-full font-medium hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                @if (isSubmitting()) {
                <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
                }
                {{ lang.t('feed.post') }}
            </button>
        </div>

    </div>
</div>
